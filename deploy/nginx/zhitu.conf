# nginx 配置：给「已有 nginx」的服务器追加 zhitu.zhengyun.online
# 场景：服务器 80/443 已被 nginx 占用（如个人网站 www.zhengyun.online），不能再装 Caddy。
#
# 用法（Ubuntu，nginx sites-available 布局）：
#   sudo cp /opt/hr-ai/deploy/nginx/zhitu.conf /etc/nginx/sites-available/zhitu.conf
#   sudo ln -s /etc/nginx/sites-available/zhitu.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 然后签证书（certbot 会自动改写本文件加 443 配置和 80→443 跳转）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d zhitu.zhengyun.online
#
# 注意：只新增这个文件，不改动现有站点（www.zhengyun.online）的任何配置。

# 第一阶段：先只配 HTTP（certbot 需要经由 80 端口验证域名）
server {
    listen 80;
    server_name zhitu.zhengyun.online;

    # certbot 续期验证用
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # 其余全部转发给后端（后端已托管前端 dist，单端口即可）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式回答必须关缓冲，否则回答会整段卡住最后一次性吐出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# 签完证书后 certbot 会自动补上 443 的 server 块；
