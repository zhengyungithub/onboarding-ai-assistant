# Nginx 反代样例（如果你更熟悉 Nginx；HTTPS 证书用 certbot 申请）
server {
    listen 80;
    server_name zhitu.zhengyun.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zhitu.zhengyun.online;

    # certbot 会自动填充/续期这两行
    ssl_certificate     /etc/letsencrypt/live/zhitu.zhengyun.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhitu.zhengyun.online/privkey.pem;

    client_max_body_size 50m;   # 文档上传

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 流式接口：必须关闭缓冲，否则回答会卡住最后一次性输出
    location /api/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
